# Fly.io deploy config for DebateBot.
#
# First time setup (run on your laptop):
#   1) curl -L https://fly.io/install.sh | sh
#   2) fly auth login
#   3) fly launch --no-deploy   (creates the app + edits this file)
#   4) fly secrets set GROQ_API_KEY=gsk_...
#   5) fly deploy
#
# Subsequent deploys: `fly deploy`

app = "debatebot"  # CHANGE this to a globally-unique name when you run `fly launch`
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
