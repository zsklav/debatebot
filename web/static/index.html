<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DebateBot — pressure-test your arguments</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .msg-you { background: #1e3a5f; color: #e6f0ff; }
  .msg-bot { background: #2d1f1f; color: #ffe6e6; }
  .panel   { background: #1a1a1a; color: #e6e6e6; border: 1px solid #333; }
  pre.transcript { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen">

<div class="max-w-5xl mx-auto p-6">

  <header class="mb-6">
    <h1 class="text-3xl font-bold">DebateBot</h1>
    <p class="text-neutral-400">An AI that disagrees with you, three different ways. Built to pressure-test arguments.</p>
  </header>

  <!-- Persona picker -->
  <section id="persona-picker" class="mb-6">
    <div class="text-sm text-neutral-400 mb-2">Pick a persona to debate with:</div>
    <div id="persona-buttons" class="flex flex-wrap gap-2"></div>
  </section>

  <!-- Active debate -->
  <section id="debate" class="hidden">
    <div class="flex items-center justify-between mb-2">
      <div id="active-persona" class="text-lg font-semibold"></div>
      <div class="flex gap-2">
        <button id="btn-score"    class="px-3 py-1 text-sm bg-neutral-800 hover:bg-neutral-700 rounded">Score argument</button>
        <button id="btn-findhole" class="px-3 py-1 text-sm bg-neutral-800 hover:bg-neutral-700 rounded">Find the hole</button>
        <button id="btn-newdebate" class="px-3 py-1 text-sm bg-red-900 hover:bg-red-800 rounded">New debate</button>
      </div>
    </div>

    <div id="messages" class="space-y-3 mb-4 min-h-[200px]"></div>

    <form id="turn-form" class="flex gap-2">
      <input id="turn-input" type="text" autocomplete="off"
        placeholder="Make a claim, then defend it..."
        class="flex-1 p-3 rounded bg-neutral-900 border border-neutral-700 focus:border-neutral-400 outline-none" />
      <button type="submit" class="px-4 py-3 bg-blue-700 hover:bg-blue-600 rounded font-semibold">Send</button>
    </form>
    <div id="turn-meta" class="text-xs text-neutral-500 mt-1"></div>
  </section>

  <!-- Result panels -->
  <section id="score-panel" class="hidden mt-6 panel rounded p-4"></section>
  <section id="hole-panel"  class="hidden mt-6 panel rounded p-4"></section>

  <hr class="border-neutral-800 my-8" />

  <!-- Standalone find-the-hole -->
  <section>
    <h2 class="text-xl font-semibold mb-2">Or paste any argument and find the single weakest claim:</h2>
    <textarea id="standalone-arg" rows="5"
      placeholder="Paste a claim, paragraph, or whole essay..."
      class="w-full p-3 rounded bg-neutral-900 border border-neutral-700 focus:border-neutral-400 outline-none"></textarea>
    <button id="btn-standalone-findhole"
      class="mt-2 px-4 py-2 bg-amber-700 hover:bg-amber-600 rounded font-semibold">Find the hole</button>
    <section id="standalone-hole-panel" class="hidden mt-4 panel rounded p-4"></section>
  </section>

</div>

<script>
let sessionId = null;
let activePersonaName = null;

const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`${r.status} ${t}`);
  }
  return r.json();
}

// Load personas + build buttons
async function loadPersonas() {
  const { personas } = await api("GET", "/api/personas");
  const container = $("persona-buttons");
  container.innerHTML = "";
  for (const p of personas) {
    const btn = document.createElement("button");
    btn.className = "flex-1 min-w-[200px] p-4 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 rounded text-left";
    btn.innerHTML = `<div class="font-semibold">${p.name}</div><div class="text-xs text-neutral-400 mt-1">${p.tagline}</div>`;
    btn.onclick = () => startDebate(p.key, p.name);
    container.appendChild(btn);
  }
}

async function startDebate(personaKey, personaName) {
  const r = await api("POST", "/api/debate", { persona_key: personaKey });
  sessionId = r.session_id;
  activePersonaName = r.persona_name;
  $("persona-picker").classList.add("hidden");
  $("debate").classList.remove("hidden");
  $("active-persona").textContent = `Debating: ${activePersonaName}`;
  $("messages").innerHTML = "";
  $("score-panel").classList.add("hidden");
  $("hole-panel").classList.add("hidden");
  $("turn-input").focus();
}

function addMessage(who, text) {
  const div = document.createElement("div");
  const cls = who === "YOU" ? "msg-you" : "msg-bot";
  div.className = `${cls} p-3 rounded`;
  div.innerHTML = `<div class="text-xs opacity-70 mb-1">${who}</div><div class="whitespace-pre-wrap">${escapeHtml(text)}</div>`;
  $("messages").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("turn-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("turn-input");
  const msg = input.value.trim();
  if (!msg || !sessionId) return;
  input.value = "";
  addMessage("YOU", msg);
  $("turn-meta").textContent = "Thinking...";
  try {
    const r = await api("POST", `/api/debate/${sessionId}/turn`, { message: msg });
    addMessage(activePersonaName.toUpperCase(), r.reply);
    $("turn-meta").textContent = `Turn ${r.turn_count} — ${r.total_tokens} tokens used so far`;
  } catch (err) {
    $("turn-meta").textContent = `Error: ${err.message}`;
  }
});

$("btn-score").addEventListener("click", async () => {
  if (!sessionId) return;
  $("score-panel").classList.remove("hidden");
  $("score-panel").innerHTML = "<div class='opacity-60'>Scoring...</div>";
  try {
    const s = await api("POST", `/api/debate/${sessionId}/score`);
    $("score-panel").innerHTML = renderScore(s);
  } catch (err) {
    $("score-panel").innerHTML = `<div class='text-red-400'>Error: ${err.message}</div>`;
  }
});

$("btn-findhole").addEventListener("click", async () => {
  if (!sessionId) return;
  $("hole-panel").classList.remove("hidden");
  $("hole-panel").innerHTML = "<div class='opacity-60'>Locating the single weakest claim...</div>";
  try {
    const h = await api("POST", `/api/debate/${sessionId}/findhole`);
    $("hole-panel").innerHTML = renderHole(h);
  } catch (err) {
    $("hole-panel").innerHTML = `<div class='text-red-400'>Error: ${err.message}</div>`;
  }
});

$("btn-newdebate").addEventListener("click", () => {
  sessionId = null;
  $("debate").classList.add("hidden");
  $("persona-picker").classList.remove("hidden");
  $("score-panel").classList.add("hidden");
  $("hole-panel").classList.add("hidden");
});

$("btn-standalone-findhole").addEventListener("click", async () => {
  const arg = $("standalone-arg").value.trim();
  if (!arg) return;
  $("standalone-hole-panel").classList.remove("hidden");
  $("standalone-hole-panel").innerHTML = "<div class='opacity-60'>Locating the single weakest claim...</div>";
  try {
    const h = await api("POST", "/api/findhole", { argument: arg });
    $("standalone-hole-panel").innerHTML = renderHole(h);
  } catch (err) {
    $("standalone-hole-panel").innerHTML = `<div class='text-red-400'>Error: ${err.message}</div>`;
  }
});

function renderBar(score) {
  const pct = (score / 10) * 100;
  const color = score >= 8 ? "bg-green-700" : score >= 5 ? "bg-yellow-700" : "bg-red-700";
  return `<div class="w-full bg-neutral-800 rounded h-2 overflow-hidden"><div class="${color} h-2" style="width:${pct}%"></div></div>`;
}

function renderScore(s) {
  const row = (label, axis) => `
    <div class="mb-3">
      <div class="flex justify-between text-sm mb-1"><span>${label}</span><span class="font-mono">${axis.score}/10</span></div>
      ${renderBar(axis.score)}
      <div class="text-xs text-neutral-400 mt-1">${escapeHtml(axis.rationale)}</div>
    </div>`;
  return `
    <h3 class="text-lg font-semibold mb-3">Argument score — overall ${s.overall}/10</h3>
    ${row("Logical coherence",    s.logical_coherence)}
    ${row("Evidence quality",     s.evidence_quality)}
    ${row("Opposition handling",  s.opposition_handling)}
    ${row("Clarity",              s.clarity)}
    <div class="mt-4 p-3 bg-neutral-900 rounded text-sm"><strong>Verdict:</strong> ${escapeHtml(s.summary)}</div>
  `;
}

function renderHole(h) {
  return `
    <h3 class="text-lg font-semibold mb-2">The hole — severity ${h.severity}/10</h3>
    <div class="mb-3">
      <div class="text-xs text-neutral-400 uppercase tracking-wide">Weakest claim (verbatim)</div>
      <div class="text-amber-200 italic mt-1">"${escapeHtml(h.weakest_claim)}"</div>
    </div>
    <div class="mb-3">
      <div class="text-xs text-neutral-400 uppercase tracking-wide">Why it's weak</div>
      <div class="mt-1">${escapeHtml(h.why_weak)}</div>
    </div>
    <div class="mb-3">
      <div class="text-xs text-neutral-400 uppercase tracking-wide">The attack</div>
      <div class="mt-1">${escapeHtml(h.the_attack)}</div>
    </div>
    <div>
      <div class="text-xs text-neutral-400 uppercase tracking-wide">How to defend it</div>
      <div class="mt-1 text-green-200">${escapeHtml(h.how_to_defend)}</div>
    </div>
  `;
}

loadPersonas();
</script>
</body>
</html>
